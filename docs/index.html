<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nisar Office Studio</title>
<style>
  :root { --bg: #ffffff; --text: #1f1f1f; --muted: #5f6368; --accent: #1f5fbf; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #18191b; --text: #ececec; --muted: #a9adb3; --accent: #7aa7ff; } }
  html { background: var(--bg); }
  body { margin: 0 auto; max-width: 860px; padding: 32px 16px 64px; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 30px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  a { color: var(--accent); }
  img { max-width: 100%; height: auto; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.18); margin: 16px 0; }
</style>
</head>
<body>
<h1>Nisar Office Studio</h1>
<p class="muted">A free, open-source word processor and PDF editor for Windows. Works offline. No account, no ads, no tracking.</p>
<p><a href="https://github.com/nisarkhan4u-hash/nisar-office-studio">Source code</a> · <a href="https://apps.microsoft.com/detail/9MXVXPSM8CS8">Get it free from the Microsoft Store</a> · <a href="https://github.com/nisarkhan4u-hash/nisar-office-studio/releases">Installer</a> · <a href="privacy-policy.html">Privacy policy</a> · <a href="https://github.com/nisarkhan4u-hash/nisar-office-studio/issues">Support</a></p>

</body>
</html>
